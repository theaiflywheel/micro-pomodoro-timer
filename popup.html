<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 200px; padding: 20px; text-align: center; font-family: sans-serif; background: #1a1a1a; color: white; }
    #time { font-size: 3em; font-weight: bold; margin: 10px 0; color: #00ff88; }
    #status { text-transform: uppercase; letter-spacing: 1px; font-size: 0.8em; color: #aaa; }
    button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; }
    #start { background: #00ff88; color: #000; }
    #stop { background: #ff4444; color: white; }
  </style>
</head>
<body>
  <div id="status">Ready</div>
  <div id="time">10:00</div>
  <button id="start">START LOOP</button>
  <button id="stop">STOP</button>
  <script src="popup.js"></script>
</body>
</html>
