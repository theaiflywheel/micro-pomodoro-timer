<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 200px; 
      padding: 20px; 
      text-align: center; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #121212; 
      color: white; 
      margin: 0;
    }
    #status { 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      font-size: 0.7rem; 
      color: #888; 
      margin-bottom: 5px;
    }
    #time { 
      font-size: 3.5rem; 
      font-weight: 800; 
      margin: 5px 0 20px 0; 
      color: #00ff88; /* Neon Green */
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      border: none; 
      border-radius: 8px; 
      transition: transform 0.1s, background 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    #start { 
      background: #00ff88; 
      color: #000; 
    }
    #start:hover {
      background: #00e67a;
    }
    #stop { 
      background: #333; 
      color: #ff4444; 
      border: 1px solid #444;
    }
    #stop:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div id="status">Ready</div>
  <div id="time">2:00</div>
  <button id="start">START LOOP</button>
  <button id="stop">STOP / RESET</button>
  <script src="popup.js"></script>
</body>
</html>
